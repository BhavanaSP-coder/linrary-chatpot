<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Find a good next read and get quick answers about this demo library."><title>Library Chatbot</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="wrap"><small>Standalone demo app</small><h1>Library Chatbot</h1><p>Find a good next read and get quick answers about this demo library.</p></div></header><main class="main"><section class="panel"><h2>Library assistant</h2><label for="input">What would you like help with?</label><textarea id="input" placeholder="Try “science”, “mystery”, “opening hours”, or “borrowing”."></textarea><button onclick="run()">Ask the library</button><div id="result" class="result" aria-live="polite"></div></section><footer>Runs locally in your browser. Demo content is generated from your input and is not a substitute for verified or professional advice.</footer></main><script>function out(html){document.querySelector('#result').innerHTML=html}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const books=[['The Hidden Life of Trees','Peter Wohlleben','Nature'],['Project Hail Mary','Andy Weir','Science fiction'],['The Thursday Murder Club','Richard Osman','Mystery'],['A Brief History of Time','Stephen Hawking','Science'],['The Midnight Library','Matt Haig','Fiction'],['The Very Secret Society of Irregular Witches','Sangu Mandanna','Fantasy']];function run(){let q=document.querySelector('#input').value.trim();if(!q){out('Ask a question or search for a book.');return}let k=q.toLowerCase();let found=books.filter(b=>b.join(' ').toLowerCase().includes(k));if(found.length)out('<h3>Books you might like</h3>'+found.map(b=>`<div class="card"><b>${esc(b[0])}</b><p>${esc(b[1])} · ${esc(b[2])}</p><span class="badge">Demo catalog · check availability in person</span></div>`).join(''));else if(/hour|open|close/.test(k))out('<h3>Opening hours</h3><p>Demo library hours: Monday–Friday, 9:00 AM–6:00 PM; Saturday, 10:00 AM–4:00 PM.</p><span class="badge">Sample information — replace with your library’s details.</span>');else if(/borrow|loan|due|return/.test(k))out('<h3>Borrowing</h3><p>Demo policy: borrow up to 5 books for 21 days. Renewals depend on availability.</p><span class="badge">Sample policy — confirm with your library.</span>');else out('<h3>Try a catalog search</h3><p>I couldn’t find that in the sample catalog. Search by title, author, or genre, or ask about hours or borrowing.');}</script></body></html>
